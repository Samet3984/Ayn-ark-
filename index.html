<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aynı Şarkı</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#08090d;
    --card:#11131a;
    --card2:#191b24;
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#9297a8;
    --accent:#8b5cf6;
    --accent2:#ec4899;
    --green:#22c55e;
}

html,
body{
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================================
   LOGIN
========================================= */

.login-screen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(139,92,246,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(236,72,153,.13),
            transparent 30%
        ),
        var(--bg);
}

.login-box{
    width:100%;
    max-width:430px;
    text-align:center;
}

.logo{
    width:78px;
    height:78px;
    margin:0 auto 24px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:37px;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    box-shadow:
        0 20px 60px
        rgba(139,92,246,.35);
}

.login-box h1{
    font-size:37px;
    letter-spacing:-1.5px;
    margin-bottom:10px;
}

.login-box p{
    color:var(--muted);
    line-height:1.6;
    margin-bottom:30px;
}

.input-group{
    text-align:left;
    margin-bottom:14px;
}

.input-group label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
}

.input{
    width:100%;
    padding:16px 17px;
    color:white;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:16px;
    outline:none;
}

.input:focus{
    border-color:var(--accent);
}

.primary-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    color:white;
    font-weight:800;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    box-shadow:
        0 12px 30px
        rgba(139,92,246,.25);
}

/* =========================================
   SONG SELECTION
========================================= */

.song-screen{
    min-height:100vh;
    min-height:100dvh;
    padding:40px 20px 120px;
    display:flex;
    justify-content:center;
}

.song-box{
    width:100%;
    max-width:650px;
}

.top-mini{
    color:#b69cff;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
}

.song-box h2{
    font-size:31px;
    line-height:1.15;
    margin-bottom:10px;
}

.song-box>p{
    color:var(--muted);
    margin-bottom:25px;
    line-height:1.5;
}

.search-box{
    position:relative;
    margin-bottom:15px;
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.search-input{
    padding-left:46px;
}

.song-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.song-option{
    display:flex;
    align-items:center;
    gap:13px;
    padding:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    border-radius:18px;
    transition:.2s;
}

.song-option:active{
    transform:scale(.985);
}

.album{
    width:56px;
    height:56px;
    flex:0 0 56px;
    object-fit:cover;
    border-radius:13px;
    background:#222;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play-preview{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(139,92,246,.16);
    color:#c4b5fd;
}

/* =========================================
   APP
========================================= */

.app{
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:175px;
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(139,92,246,.12),
            transparent 32%
        ),
        var(--bg);
}

.header{
    position:sticky;
    top:0;
    z-index:40;
    padding:15px 17px;
    background:rgba(8,9,13,.84);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.brand-name{
    font-weight:850;
}

.profile{
    display:flex;
    align-items:center;
    gap:8px;
}

.profile-button{
    background:transparent;
    color:white;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:850;
    background:
        linear-gradient(
            135deg,
            #6366f1,
            #ec4899
        );
}

.main{
    max-width:900px;
    margin:auto;
    padding:20px 16px;
}

/* =========================================
   CURRENT SONG
========================================= */

.current-song{
    padding:20px;
    border-radius:25px;
    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.24),
            rgba(236,72,153,.10)
        ),
        var(--card);
    border:1px solid var(--border);
    margin-bottom:24px;
}

.current-label{
    color:#c4b5fd;
    font-size:11px;
    font-weight:850;
    letter-spacing:.8px;
    text-transform:uppercase;
    margin-bottom:13px;
}

.current-content{
    display:flex;
    align-items:center;
    gap:15px;
}

.current-album{
    width:76px;
    height:76px;
    object-fit:cover;
    border-radius:17px;
}

.current-info{
    flex:1;
    min-width:0;
}

.current-info h3{
    font-size:19px;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.current-info p{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.change-song{
    width:100%;
    padding:12px;
    margin-top:18px;
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.07);
}

/* =========================================
   PEOPLE
========================================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:13px;
}

.section-title h2{
    font-size:20px;
    line-height:1.2;
}

.online-count{
    color:var(--green);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.people{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.person{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px;
    border-radius:18px;
    background:var(--card);
    border:1px solid var(--border);
}

.person-avatar{
    width:51px;
    height:51px;
    flex:0 0 51px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:850;
    position:relative;
}

.status{
    width:11px;
    height:11px;
    position:absolute;
    right:0;
    bottom:1px;
    background:var(--green);
    border:2px solid var(--card);
    border-radius:50%;
}

.person-info{
    flex:1;
    min-width:0;
}

.person-name{
    font-weight:750;
}

.person-status{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.chat-arrow{
    color:#777b89;
    font-size:22px;
}

/* =========================================
   MUSIC PLAYER
========================================= */

.music-player{
    position:fixed;
    left:10px;
    right:10px;
    bottom:76px;
    z-index:55;
    padding:10px 12px;
    border-radius:18px;
    background:rgba(22,24,32,.96);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.player-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.player-cover{
    width:45px;
    height:45px;
    border-radius:10px;
    object-fit:cover;
}

.player-info{
    flex:1;
    min-width:0;
}

.player-title{
    font-size:13px;
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-controls{
    display:flex;
    align-items:center;
    gap:5px;
}

.player-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(255,255,255,.07);
}

.player-btn.play{
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.progress-area{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
}

.progress-time{
    width:30px;
    color:#777b89;
    font-size:9px;
}

.progress{
    flex:1;
    height:4px;
    border-radius:10px;
    background:#343641;
    appearance:none;
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
}

.volume{
    width:65px;
    height:4px;
    appearance:none;
    background:#343641;
}

.volume::-webkit-slider-thumb{
    appearance:none;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
}

/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    z-index:60;
    background:rgba(10,11,15,.94);
    backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
}

.nav-items{
    width:100%;
    max-width:500px;
    display:flex;
    justify-content:space-around;
}

.nav-item{
    min-width:70px;
    color:#777b89;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:10px;
}

.nav-item.active{
    color:white;
}

.nav-icon{
    font-size:20px;
}

/* =========================================
   CHAT
========================================= */

.chat{
    position:fixed;
    inset:0;
    z-index:150;
    background:#090a0e;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:72px;
    flex:0 0 72px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:9px;
    background:rgba(12,13,18,.96);
    border-bottom:1px solid var(--border);
}

.back-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:transparent;
    color:white;
    font-size:25px;
}

.chat-person{
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-person-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:850;
}

.chat-name{
    font-weight:750;
}

.chat-online{
    color:var(--green);
    font-size:10px;
    margin-top:2px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overscroll-behavior:contain;
}

.message{
    max-width:78%;
    padding:10px 13px;
    border-radius:16px;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
}

.message.me{
    align-self:flex-end;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            #7c3aed
        );
    border-bottom-right-radius:5px;
}

.message.other{
    align-self:flex-start;
    background:#191b24;
    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    text-align:right;
    font-size:9px;
    opacity:.5;
    margin-top:4px;
}

.chat-input-area{
    flex:0 0 auto;
    padding:9px;
    padding-bottom:
        calc(9px + env(safe-area-inset-bottom));
    background:#0d0e13;
    border-top:1px solid var(--border);
}

.chat-form{
    display:flex;
    gap:8px;
}

.chat-input{
    flex:1;
    min-width:0;
    padding:13px 16px;
    color:white;
    background:#191b24;
    border:1px solid var(--border);
    border-radius:22px;
    outline:none;
}

.send-btn{
    width:46px;
    height:46px;
    flex:0 0 46px;
    border-radius:50%;
    color:white;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

/* =========================================
   PROFILE MODAL
========================================= */

.profile-modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(7px);
}

.profile-card{
    width:100%;
    max-width:500px;
    padding:22px 18px 28px;
    background:#11131a;
    border:1px solid var(--border);
    border-radius:28px 28px 0 0;
    box-shadow:0 -20px 60px rgba(0,0,0,.4);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.modal-header h2{
    font-size:21px;
}

.close-modal{
    width:36px;
    height:36px;
    border-radius:50%;
    color:white;
    background:rgba(255,255,255,.07);
}

.profile-big{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
}

.profile-big-avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:850;
    background:
        linear-gradient(
            135deg,
            #6366f1,
            #ec4899
        );
}

.profile-big-name{
    font-size:19px;
    font-weight:800;
}

.setting-row{
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.setting-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;
}

.danger-btn{
    width:100%;
    padding:14px;
    margin-top:20px;
    color:#ff8f8f;
    background:rgba(239,68,68,.1);
    border-radius:14px;
}

/* =========================================
   EMPTY / LOADING
========================================= */

.empty{
    padding:40px 20px;
    text-align:center;
    border:1px dashed rgba(255,255,255,.12);
    border-radius:20px;
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
}

.empty h3{
    margin-bottom:7px;
}

.empty p{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.loading{
    padding:25px;
    text-align:center;
    color:var(--muted);
}

/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:150px;
    z-index:500;
    transform:
        translate(-50%,20px);
    background:#20222c;
    color:white;
    padding:12px 18px;
    border-radius:14px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================================
   DESKTOP
========================================= */

@media(min-width:700px){

    .music-player{
        left:50%;
        right:auto;
        width:500px;
        transform:translateX(-50%);
    }

    .chat{
        inset:5% 50%;
        transform:translateX(-50%);
        width:500px;
        height:90%;
        border-radius:25px;
        overflow:hidden;
        border:1px solid var(--border);
        box-shadow:0 30px 100px rgba(0,0,0,.65);
    }

    .profile-card{
        border-radius:28px;
        margin-bottom:20px;
    }

    .profile-modal{
        align-items:center;
    }
}
</style>
</head>

<body>


<!-- =========================================
     LOGIN
========================================= -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="login-box">

        <div class="logo">
