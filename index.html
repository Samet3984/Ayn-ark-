<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Müzik Platformu</title>
    <style>
        body { background: #0f1117; color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 450px; }
        .screen { display: none; }
        .active { display: block; }
        
        /* Giriş Ekranı Düzeni */
        #login-screen { text-align: center; }
        #login-screen h2 { font-size: 32px; color: #00ff88; margin-bottom: 30px; }
        input { width: 100%; padding: 18px; margin: 15px 0; background: #1a1d24; border: 2px solid #333; color: white; border-radius: 12px; font-size: 16px; }
        button { width: 100%; padding: 18px; background: #00ff88; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; color: black; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .song-card { background: #1a1d24; padding: 20px; margin-bottom: 15px; border-radius: 15px; cursor: pointer; font-size: 18px; }
        .player { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: #12141c; padding: 20px; display: none; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ -->
        <div id="login-screen" class="screen active">
            <h2>Giriş Yap</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <button onclick="login()">Giriş Yap</button>
        </div>

        <!-- ANA EKRAN -->
        <div id="home-screen" class="screen">
            <div class="header"><h3>Keşfet</h3><div onclick="show('profile-screen')" style="cursor:pointer; font-size: 24px;">👤</div></div>
            <div class="song-card" onclick="play('Lofi Chill')">Lofi Chill ▶</div>
        </div>

        <!-- PROFİL -->
        <div id="profile-screen" class="screen">
            <div class="header"><h3>Profilin</h3><span onclick="show('home-screen')" style="cursor:pointer">Kapat</span></div>
            <input type="text" placeholder="Şehir">
            <input type="number" placeholder="Yaş">
            <input type="text" placeholder="Sevdiğin Müzik Türü">
            <button onclick="show('home-screen')">Kaydet</button>
        </div>

        <!-- MÜZİK ÇALAR -->
        <div id="player-bar" class="player">
            <div id="now-playing" style="font-size: 14px; margin-bottom: 10px; color: #00ff88;">Müzik seçilmedi</div>
            <audio id="audio" controls style="width: 100%;"></audio>
        </div>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function login() {
            document.getElementById('player-bar').style.display = 'block';
            show('home-screen');
        }
        function play(song) { document.getElementById('now-playing').innerText = "Çalıyor: " + song; }
    </script>
</body>
</html>
