<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aynı Şarkı</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #08090d;
    --card: #11131a;
    --card2: #171923;
    --border: rgba(255,255,255,.08);
    --text: #ffffff;
    --muted: #9095a5;
    --accent: #8b5cf6;
    --accent2: #ec4899;
    --green: #22c55e;
}

html,
body {
    min-height: 100%;
    background: var(--bg);
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* ==========================================
   LOGIN
========================================== */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(139,92,246,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(236,72,153,.12),
            transparent 30%
        ),
        var(--bg);
}

.login-box {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

.logo {
    width: 76px;
    height: 76px;
    margin: 0 auto 24px;

    border-radius: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 20px 60px
        rgba(139,92,246,.35);
}

.login-box h1 {
    font-size: 36px;
    margin-bottom: 10px;
    letter-spacing: -1px;
}

.login-box p {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 32px;
}

.input-group {
    text-align: left;
    margin-bottom: 14px;
}

.input-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
}

.input {
    width: 100%;

    padding: 16px 18px;

    background: rgba(255,255,255,.05);

    border: 1px solid var(--border);

    border-radius: 16px;

    color: white;

    outline: none;

    transition: .2s;
}

.input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,.07);
}

.primary-btn {
    width: 100%;

    padding: 16px;

    margin-top: 8px;

    border-radius: 16px;

    color: white;

    font-weight: 700;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 12px 30px
        rgba(139,92,246,.25);

    transition: .2s;
}

.primary-btn:active {
    transform: scale(.98);
}


/* ==========================================
   SONG SELECTION
========================================== */

.song-screen {
    min-height: 100vh;

    padding: 40px 20px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.song-box {
    width: 100%;
    max-width: 600px;
}

.top-mini {
    color: var(--accent);

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 12px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.song-box h2 {
    font-size: 32px;
    line-height: 1.15;
    margin-bottom: 10px;
}

.song-box > p {
    color: var(--muted);
    margin-bottom: 28px;
}

.search-box {
    position: relative;
    margin-bottom: 18px;
}

.search-box span {
    position: absolute;

    left: 17px;
    top: 50%;

    transform: translateY(-50%);

    color: var(--muted);
}

.search-box input {
    padding-left: 48px;
}

.song-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.song-option {
    display: flex;

    align-items: center;

    gap: 14px;

    padding: 12px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.035);

    border-radius: 18px;

    transition: .2s;
}

.song-option:hover {
    background: rgba(255,255,255,.07);

    border-color:
        rgba(139,92,246,.4);
}

.album {
    width: 54px;
    height: 54px;

    flex: 0 0 54px;

    border-radius: 13px;

    object-fit: cover;

    background: #222;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.artist {
    color: var(--muted);

    font-size: 13px;

    margin-top: 4px;
}
