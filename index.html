<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1a1d24;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 24px;
            color: #00ff88;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a2f3a;
            background-color: #0f1117;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00ff88;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #00ff88;
            color: #000;
        }
        .btn-primary:hover {
            background-color: #00cc6a;
        }
        .divider {
            margin: 20px 0;
            font-size: 12px;
            color: #888;
            position: relative;
        }
        .btn-social {
            background-color: #ffffff;
            color: #000;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Giriş Yap</h2>
        <div class="input-group">
            <input type="text" placeholder="Kullanıcı Adı">
        </div>
        <div class="input-group">
            <input type="password" placeholder="Şifre">
        </div>
        <button class="btn btn-primary">Giriş Yap</button>
        
        <div class="divider">veya şununla devam et</div>
        
        <button class="btn btn-social">Google ile Devam Et</button>
    </div>

</body>
</html>
