<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Müzik Platformu | Premium</title>
    <style>
        :root { --accent: #00ff88; --bg: #0f1117; --card: #1a1d24; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* GİRİŞ */
        .login-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        h1 { color: var(--accent); font-size: 2.5rem; margin-bottom: 2rem; }
        input { width: 100%; max-width: 300px; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: var(--card); color: white; }
        .btn { width: 100%; max-width: 300px; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: black; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* ANA SAYFA & PROFİL */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #333; border: 2px solid var(--accent); }
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .player { position: fixed; bottom: 0; width: 100%; background: #12141c; padding: 20px; box-sizing: border-box; border-top: 1px solid #333; display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Müzikify</h1>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <button class="btn" onclick="login()">Hadi Başlayalım</button>
            <button class="btn" style="background: white;">Google ile Giriş</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <div class="header">
            <h2>Keşfet</h2>
            <div class="avatar" onclick="show('profile-screen')" style="display:flex; align-items:center; justify-content:center;">👤</div>
        </div>
        <div class="card" onclick="play('Lofi Dreams')"><span>Lofi Dreams</span><span>▶</span></div>
        <div class="card" onclick="play('Jazz Night')"><span>Jazz Night</span><span>▶</span></div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="header"><h2>Profilin</h2><span onclick="show('home-screen')">Kapat</span></div>
        <input type="file" style="border:none;">
        <input type="text" placeholder="Şehir">
        <input type="number" placeholder="Yaş">
        <input type="text" placeholder="Sevdiğin Müzik Türü">
        <button class="btn" onclick="show('home-screen')">Değişiklikleri Kaydet</button>
    </div>

    <div id="player-bar" class="player">
        <div id="now-playing" style="color: var(--accent); margin-bottom: 5px;">Müzik seçilmedi</div>
        <audio id="audio" controls style="width: 100%;"></audio>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function login() { document.getElementById('player-bar').style.display = 'block'; show('home-screen'); }
        function play(s) { document.getElementById('now-playing').innerText = "Çalıyor: " + s; }
    </script>
</body>
</html>
