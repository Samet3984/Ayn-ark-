<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müzik Platformu - Tam Sürüm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1a1d24;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2, h3 {
            color: #00ff88;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #2a2f3a;
            background-color: #0f1117;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00ff88;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #00ff88;
            color: #000;
        }
        .btn-primary:hover {
            background-color: #00cc6a;
        }
        .divider {
            margin: 15px 0;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .btn-social {
            background-color: #ffffff;
            color: #000;
            margin-bottom: 8px;
        }
        
        /* Ana Uygulama Alanı */
        #app-screen {
            display: none;
        }
        .profile-card {
            background-color: #242832;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .profile-info h4 {
            color: #00ff88;
            font-size: 15px;
        }
        .profile-info p {
            color: #aaa;
            font-size: 12px;
        }
        .playlist {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .song-item {
            background-color: #242832;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-item:hover {
            background-color: #2f3542;
            border-left: 4px solid #00ff88;
        }
        .player-bar {
            background-color: #12141c;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 8px;
        }
        .control-btn {
            background: none;
            border: none;
            color: #00ff88;
            font-size: 18px;
            cursor: pointer;
        }
        .logout-btn {
            background-color: #ff4757;
            color: white;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ EKRANI -->
        <div id="login-screen">
            <h2>Giriş Yap</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Kullanıcı Adı (Örn: Samet)">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Şifre">
            </div>
            <button class="btn btn-primary" onclick="login()">Sisteme Giriş Yap</button>
            
            <div class="divider">veya hızlı bağlan</div>
            
            <button class="btn btn-social" onclick="login()">Google ile Devam Et</button>
            <button class="btn btn-social" onclick="login()">Spotify ile Bağlan</button>
        </div>

        <!-- ANA PLATFORM EKRANI -->
        <div id="app-screen">
            <!-- Profil Bilgileri -->
            <div class="profile-card">
                <div class="profile-info">
                    <h4 id="profile-name">Kullanıcı</h4>
                    <p>Aktif Üye • Standart Plan</p>
                </div>
                <span style="font-size: 20px;">🎧</span>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Şarkı, sanatçı veya albüm ara...">
            </div>

            <h3 style="font-size: 14px; text-align: left; margin-bottom: 8px;">Çalma Listesi</h3>
            <div class="playlist">
                <div class="song-item" onclick="playRealSong('Lofi Chill Beat', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">
                    <div>
                        <div style="font-size: 14px; font-weight: 500;">Lofi Chill Beat</div>
                        <div style="font-size: 11px; color: #888;">Ambient Beats</div>
                    </div>
                    <span style="color: #00ff88; font-size: 12px;">▶ Çal</span>
                </div>
                <div class="song-item" onclick="playRealSong('Akustik Gitar Rüzgarı', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">
                    <div>
                        <div style="font-size: 14px; font-weight: 500;">Akustik Gitar Rüzgarı</div>
                        <div style="font-size: 11px; color: #888;">Enstrümantal</div>
                    </div>
                    <span style="color: #00ff88; font-size: 12px;">▶ Çal</span>
                </div>
                <div class="song-item" onclick="playRealSong('Gece Yolculuğu', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">
                    <div>
                        <div style="font-size: 14px; font-weight: 500;">Gece Yolculuğu</div>
                        <div style="font-size: 11px; color: #888;">Synthwave</div>
                    </div>
                    <span style="color: #00ff88; font-size: 12px;">▶ Çal</span>
                </div>
            </div>

            <!-- Aktif Müzik Çalar Paneli -->
            <div class="player-bar">
                <div id="now-playing" style="font-size: 13px; color: #00ff88; margin-bottom: 5px;">Şarkı Seçilmedi</div>
                <audio id="audio-player" controls style="width: 100%; height: 35px;"></audio>
            </div>

            <button class="btn logout-btn" onclick="logout()">Güvenli Çıkış Yap</button>
        </div>
    </div>

    <script>
        function login() {
            const usernameInput = document.getElementById('username').value;
            const displayName = usernameInput ? usernameInput : 'Müziksever';
            document.getElementById('profile-name').innerText = displayName;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        }

        function logout() {
            document.getElementById('audio-player').pause();
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        function playRealSong(songTitle, audioUrl) {
            const player = document.getElementById('audio-player');
            const nowPlaying = document.getElementById('now-playing');
            
            nowPlaying.innerText = "Çalınıyor: " + songTitle;
            player.src = audioUrl;
            player.play().catch(error => {
                console.log("Oynatma hatası:", error);
            });
        }
    </script>

</body>
</html>
