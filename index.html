<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müzik Platformu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f1117; color: white; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; padding-bottom: 80px; }
        .screen { display: none; padding: 20px; }
        .active { display: block; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 420px; display: flex; justify-content: space-around; background: #1a1d24; padding: 15px; border-top: 1px solid #333; }
        .nav-btn { color: #888; cursor: pointer; }
        .nav-btn.active { color: #00ff88; }

        input { width: 100%; padding: 10px; margin-top: 5px; background: #242832; border: none; color: white; border-radius: 5px; }
        .song-item { background: #242832; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .player { background: #12141c; padding: 15px; position: fixed; bottom: 65px; width: 100%; max-width: 420px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ -->
        <div id="login-screen" class="screen active">
            <h2 style="margin-top: 50px; text-align: center; color: #00ff88;">Giriş Yap</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <button onclick="login()" style="width: 100%; padding: 12px; margin-top: 20px; background: #00ff88; border: none; border-radius: 5px; font-weight: bold;">Giriş Yap</button>
        </div>

        <!-- ANA SAYFA -->
        <div id="home-screen" class="screen">
            <h3>Popüler Parçalar</h3>
            <div class="playlist" style="margin-top: 20px;">
                <div class="song-item" onclick="playSong('Lofi Chill', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">
                    <span>Lofi Chill</span><span>▶ Çal</span>
                </div>
                <div class="song-item" onclick="playSong('Akustik Rüzgar', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">
                    <span>Akustik Rüzgar</span><span>▶ Çal</span>
                </div>
            </div>
        </div>

        <!-- PROFİL -->
        <div id="profile-screen" class="screen">
            <h3>Profil Bilgileri</h3>
            <p style="margin-top: 20px;">Kullanıcı Adı:</p>
            <input type="text" id="edit-user" value="Samet3984">
            <p style="margin-top: 15px;">Hesap Türü:</p>
            <input type="text" value="Premium">
            <button onclick="alert('Bilgiler güncellendi!')" style="margin-top: 20px; width: 100%; padding: 10px;">Kaydet</button>
        </div>

        <!-- MÜZİK ÇALAR (HER YERDE GÖZÜKÜR) -->
        <div class="player">
            <div id="now-playing" style="font-size: 12px; color: #00ff88; margin-bottom: 5px;">Şarkı Seçilmedi</div>
            <audio id="audio-player" controls style="width: 100%; height: 30px;"></audio>
        </div>

        <!-- ALT MENÜ -->
        <div class="nav-bar">
            <div class="nav-btn" onclick="show('home-screen')">Ana Sayfa</div>
            <div class="nav-btn" onclick="show('profile-screen')">Profil</div>
            <div class="nav-btn" onclick="location.reload()" style="color: #ff4757;">Çıkış</div>
        </div>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function login() {
            document.getElementById('edit-user').value = document.getElementById('username').value;
            show('home-screen');
        }
        function playSong(title, url) {
            document.getElementById('now-playing').innerText = "Çalıyor: " + title;
            const player = document.getElementById('audio-player');
            player.src = url;
            player.play();
        }
    </script>
</body>
</html>
